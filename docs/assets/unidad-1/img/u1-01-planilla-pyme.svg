<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="auto" role="img" aria-label="Escena de una pequeña empresa salvadoreña al cierre de la planilla de fin de mes.">
  <!-- Fondo estructurado -->
  <rect width="760" height="260" rx="10" fill="#14171C" stroke="#262B33" stroke-width="1.5"/>
  
  <!-- Patrón sutil de fondo -->
  <line x1="0" y1="200" x2="760" y2="200" stroke="#262B33" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="280" y1="0" x2="280" y2="200" stroke="#262B33" stroke-width="1" stroke-dasharray="2 6"/>
  <line x1="490" y1="0" x2="490" y2="200" stroke="#262B33" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- ================= SECCIÓN IZQUIERDA: OFICINA Y CALENDARIO DE FIN DE MES ================= -->
  <!-- Estante superior con carpetas de contabilidad -->
  <rect x="30" y="24" width="220" height="8" rx="2" fill="#1C2027" stroke="#262B33"/>
  <rect x="42" y="10" width="14" height="14" rx="2" fill="#1C2027" stroke="#5AC8FA" stroke-width="1.4"/>
  <rect x="60" y="8" width="16" height="16" rx="2" fill="#1C2027" stroke="#FFB020" stroke-width="1.4"/>
  <rect x="80" y="10" width="14" height="14" rx="2" fill="#1C2027" stroke="#3ECF8E" stroke-width="1.4"/>
  <text x="106" y="20" font-family="IBM Plex Mono" font-size="8.5" fill="#9098A6">REGISTROS 2026</text>

  <!-- Calendario 31 de Mayo -->
  <g transform="translate(30, 48)">
    <rect width="105" height="120" rx="6" fill="#1C2027" stroke="#262B33" stroke-width="1.5"/>
    <path d="M0 6 Q0 0 6 0 L99 0 Q105 0 105 6 L105 28 L0 28 Z" fill="#FF5C5C" opacity="0.9"/>
    <circle cx="24" cy="14" r="3" fill="#14171C"/>
    <circle cx="81" cy="14" r="3" fill="#14171C"/>
    <text x="52.5" y="19" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" font-weight="700" fill="#14171C" letter-spacing="1">MAYO</text>
    <text x="52.5" y="74" text-anchor="middle" font-family="Bricolage Grotesque" font-size="38" font-weight="800" fill="#EDEEF0">31</text>
    <rect x="15" y="88" width="75" height="20" rx="4" fill="#FFB020" fill-opacity="0.12" stroke="#FFB020" stroke-width="1"/>
    <text x="52.5" y="101" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" font-weight="600" fill="#FFB020">FIN DE MES</text>
  </g>

  <!-- Reloj de pared 5:00 PM (cierre de jornada) -->
  <g transform="translate(160, 48)">
    <circle cx="45" cy="45" r="42" fill="#1C2027" stroke="#262B33" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="3" fill="#FFB020"/>
    <line x1="45" y1="45" x2="45" y2="20" stroke="#EDEEF0" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="45" x2="65" y2="45" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="8" r="1.5" fill="#9098A6"/>
    <circle cx="82" cy="45" r="1.5" fill="#9098A6"/>
    <circle cx="45" cy="82" r="1.5" fill="#9098A6"/>
    <circle cx="8" cy="45" r="1.5" fill="#9098A6"/>
    <text x="45" y="106" text-anchor="middle" font-family="IBM Plex Mono" font-size="8.5" fill="#9098A6">CIERRE LABORAL</text>
  </g>

  <!-- ================= SECCIÓN CENTRAL: ESCRITORIO DE CONTABILIDAD ================= -->
  <!-- Laptop con software de planilla -->
  <g transform="translate(305, 52)">
    <!-- Pantalla -->
    <rect x="10" y="0" width="160" height="105" rx="5" fill="#0B0D10" stroke="#262B33" stroke-width="1.5"/>
    <rect x="16" y="6" width="148" height="93" rx="3" fill="#14171C"/>
    
    <!-- Barra superior de la app -->
    <rect x="16" y="6" width="148" height="14" fill="#1C2027"/>
    <circle cx="24" cy="13" r="2.5" fill="#FF5C5C"/>
    <circle cx="32" cy="13" r="2.5" fill="#FFB020"/>
    <circle cx="40" cy="13" r="2.5" fill="#3ECF8E"/>
    <text x="82" y="16" text-anchor="middle" font-family="IBM Plex Mono" font-size="6.5" fill="#9098A6">PLANILLA_MAY2026.XLSX</text>
    
    <!-- Tabla en pantalla -->
    <rect x="22" y="26" width="136" height="12" fill="#1C2027" stroke="#262B33" stroke-width="0.8"/>
    <text x="26" y="34.5" font-family="IBM Plex Mono" font-size="6" font-weight="600" fill="#5AC8FA">EMP</text>
    <text x="56" y="34.5" font-family="IBM Plex Mono" font-size="6" font-weight="600" fill="#5AC8FA">BRUTO</text>
    <text x="88" y="34.5" font-family="IBM Plex Mono" font-size="6" font-weight="600" fill="#FFB020">ISSS+AFP</text>
    <text x="126" y="34.5" font-family="IBM Plex Mono" font-size="6" font-weight="600" fill="#3ECF8E">NETO</text>
    
    <!-- Filas -->
    <rect x="22" y="40" width="136" height="10" fill="#181B20"/>
    <text x="26" y="47.5" font-family="IBM Plex Sans" font-size="6" fill="#EDEEF0">Ana M.</text>
    <text x="56" y="47.5" font-family="IBM Plex Mono" font-size="6" fill="#EDEEF0">$600</text>
    <text x="88" y="47.5" font-family="IBM Plex Mono" font-size="6" fill="#FFB020">$61.50</text>
    <text x="126" y="47.5" font-family="IBM Plex Mono" font-size="6" fill="#3ECF8E">$538.50</text>

    <rect x="22" y="52" width="136" height="10" fill="#14171C"/>
    <text x="26" y="59.5" font-family="IBM Plex Sans" font-size="6" fill="#EDEEF0">Juan L.</text>
    <text x="56" y="59.5" font-family="IBM Plex Mono" font-size="6" fill="#EDEEF0">$2500</text>
    <text x="88" y="59.5" font-family="IBM Plex Mono" font-size="6" fill="#FFB020">$211.25</text>
    <text x="126" y="59.5" font-family="IBM Plex Mono" font-size="6" fill="#3ECF8E">$1924.98</text>

    <rect x="22" y="65" width="136" height="12" fill="#1C2027" stroke="#FFB020" stroke-width="0.8"/>
    <text x="26" y="73.5" font-family="IBM Plex Mono" font-size="6.5" font-weight="700" fill="#FFB020">TOTAL</text>
    <text x="56" y="73.5" font-family="IBM Plex Mono" font-size="6.5" font-weight="700" fill="#FFB020">$3,100</text>
    <text x="126" y="73.5" font-family="IBM Plex Mono" font-size="6.5" font-weight="700" fill="#3ECF8E">$2,463.48</text>

    <!-- Base / Teclado laptop -->
    <path d="M0 105 L180 105 L170 114 L10 114 Z" fill="#1C2027" stroke="#262B33" stroke-width="1.2"/>
    <rect x="70" y="108" width="40" height="3" rx="1" fill="#262B33"/>
  </g>

  <!-- Calculadora de escritorio -->
  <g transform="translate(315, 178)">
    <rect width="65" height="60" rx="5" fill="#1C2027" stroke="#262B33" stroke-width="1.2"/>
    <rect x="8" y="8" width="49" height="14" rx="2" fill="#0B0D10" stroke="#262B33"/>
    <text x="52" y="19" text-anchor="end" font-family="IBM Plex Mono" font-size="8" font-weight="700" fill="#3ECF8E">3,100.00</text>
    <!-- Teclas -->
    <circle cx="16" cy="30" r="3.5" fill="#262B33"/>
    <circle cx="28" cy="30" r="3.5" fill="#262B33"/>
    <circle cx="40" cy="30" r="3.5" fill="#262B33"/>
    <circle cx="52" cy="30" r="3.5" fill="#FFB020"/>
    <circle cx="16" cy="42" r="3.5" fill="#262B33"/>
    <circle cx="28" cy="42" r="3.5" fill="#262B33"/>
    <circle cx="40" cy="42" r="3.5" fill="#262B33"/>
    <circle cx="52" cy="42" r="3.5" fill="#3ECF8E"/>
    <circle cx="16" cy="52" r="3.5" fill="#262B33"/>
    <circle cx="28" cy="52" r="3.5" fill="#262B33"/>
    <circle cx="40" cy="52" r="3.5" fill="#262B33"/>
    <circle cx="52" cy="52" r="3.5" fill="#FF5C5C"/>
  </g>

  <!-- Sello de Devengo / Pasivo -->
  <g transform="translate(395, 178)">
    <rect width="80" height="60" rx="5" fill="#1C2027" stroke="#5AC8FA" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="40" cy="24" r="12" fill="#5AC8FA" fill-opacity="0.15" stroke="#5AC8FA" stroke-width="1.2"/>
    <path d="M34 24 L38 28 L46 20" fill="none" stroke="#5AC8FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="45" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" font-weight="700" fill="#5AC8FA">DEVENGADO</text>
    <text x="40" y="54" text-anchor="middle" font-family="IBM Plex Sans" font-size="6.5" fill="#9098A6">31/05/2026</text>
  </g>

  <!-- ================= SECCIÓN DERECHA: TARJETA CONCEPTUAL DEL DEVENGO ================= -->
  <g transform="translate(505, 24)">
    <rect width="225" height="212" rx="8" fill="#1C2027" stroke="#FFB020" stroke-width="1.2"/>
    
    <rect x="14" y="14" width="197" height="24" rx="4" fill="#FFB020" fill-opacity="0.15"/>
    <text x="22" y="30" font-family="IBM Plex Mono" font-size="8.5" font-weight="700" fill="#FFD873" letter-spacing="0.5">EL PRINCIPIO DE DEVENGO</text>
    
    <text x="16" y="58" font-family="IBM Plex Sans" font-size="9.5" fill="#EDEEF0" font-weight="600">Al 31 de mayo ocurre el hecho:</text>
    <text x="16" y="74" font-family="IBM Plex Sans" font-size="8.5" fill="#9098A6">1. El trabajo ya fue recibido por la pyme.</text>
    <text x="16" y="89" font-family="IBM Plex Sans" font-size="8.5" fill="#9098A6">2. Nace la obligación legal de pagar.</text>
    
    <!-- Caja de asientos simultáneos -->
    <rect x="14" y="102" width="197" height="96" rx="6" fill="#14171C" stroke="#262B33" stroke-width="1"/>
    
    <rect x="22" y="112" width="6" height="6" rx="1" fill="#5AC8FA"/>
    <text x="34" y="118" font-family="IBM Plex Mono" font-size="8" font-weight="700" fill="#5AC8FA">GASTO RECONOCIDO</text>
    <text x="34" y="130" font-family="IBM Plex Mono" font-size="7.5" fill="#9098A6">Gasto Sueldos: $3,100.00 (Debe)</text>

    <line x1="22" y1="140" x2="200" y2="140" stroke="#262B33" stroke-width="1"/>

    <rect x="22" y="150" width="6" height="6" rx="1" fill="#FFB020"/>
    <text x="34" y="156" font-family="IBM Plex Mono" font-size="8" font-weight="700" fill="#FFB020">PASIVO EXIGIBLE (HABER)</text>
    <text x="34" y="168" font-family="IBM Plex Mono" font-size="7.5" fill="#9098A6">Sueldos por pagar: $2,463.48</text>
    <text x="34" y="180" font-family="IBM Plex Mono" font-size="7.5" fill="#9098A6">Retenciones (ISSS/AFP/ISR): $636.52</text>
    <text x="34" y="191" font-family="IBM Plex Mono" font-size="7" font-weight="600" fill="#3ECF8E">→ Aunque el dinero no haya salido aún</text>
  </g>

  <!-- Borde decorativo inferior -->
  <rect x="0" y="256" width="760" height="4" fill="#FFB020"/>
</svg>

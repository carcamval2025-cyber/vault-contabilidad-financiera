<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="auto" role="img" aria-label="Escalera de cuatro escalones representando los tramos progresivos de retención de ISR, donde solo la porción que excede cada escalón se grava al porcentaje superior.">
  <!-- Fondo estructurado -->
  <rect width="500" height="320" rx="10" fill="#14171C" stroke="#262B33" stroke-width="1.5"/>
  
  <!-- Encabezado de la ilustración -->
  <g transform="translate(24, 20)">
    <rect width="180" height="18" rx="3" fill="#FFB020" fill-opacity="0.12"/>
    <text x="8" y="13" font-family="IBM Plex Mono" font-size="8" font-weight="700" fill="#FFD873" letter-spacing="0.5">METÁFORA DE LOS TRAMOS</text>
    <text x="0" y="32" font-family="Bricolage Grotesque" font-size="14" font-weight="700" fill="#EDEEF0">La Escalera Progresiva de ISR</text>
  </g>

  <!-- Leyenda / Alerta Pedagógica Superior Derecha -->
  <g transform="translate(260, 20)">
    <rect width="216" height="38" rx="6" fill="#1C2027" stroke="#FF5C5C" stroke-width="1"/>
    <circle cx="16" cy="19" r="6" fill="#FF5C5C" fill-opacity="0.2"/>
    <path d="M16 16 L16 20 M16 22 L16 23" stroke="#FF5C5C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="30" y="16" font-family="IBM Plex Sans" font-size="7.5" font-weight="700" fill="#FF5C5C">REGLA DE ORO DEL ISR:</text>
    <text x="30" y="27" font-family="IBM Plex Sans" font-size="7" fill="#EDEEF0">El % superior grava <tspan fill="#FFB020" font-weight="700">solo el exceso</tspan>, no el total.</text>
  </g>

  <!-- ================= ESCALERA DE 4 TRAMOS ================= -->
  <!-- Línea de base -->
  <line x1="24" y1="270" x2="476" y2="270" stroke="#262B33" stroke-width="1.5"/>

  <!-- ESCALÓN 1: Tramo I (Exento 0%) -->
  <!-- Rango: Hasta $472.00 (o $550 según tabla) -->
  <g transform="translate(35, 0)">
    <!-- Bloque base -->
    <rect x="0" y="225" width="90" height="45" rx="4" fill="#1C2027" stroke="#9098A6" stroke-width="1.2"/>
    <text x="45" y="244" text-anchor="middle" font-family="Bricolage Grotesque" font-size="13" font-weight="800" fill="#3ECF8E">0%</text>
    <text x="45" y="258" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#9098A6">EXENTO</text>
    <text x="45" y="286" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#5AC8FA">TRAMO I</text>
    <text x="45" y="298" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#9098A6">Base inicial</text>
  </g>

  <!-- ESCALÓN 2: Tramo II (10%) -->
  <g transform="translate(140, 0)">
    <!-- Base previa -->
    <rect x="0" y="225" width="90" height="45" fill="#1C2027" stroke="#262B33"/>
    <!-- Porción excedente 10% -->
    <rect x="0" y="175" width="90" height="50" rx="4" fill="#FFB020" fill-opacity="0.2" stroke="#FFB020" stroke-width="1.2"/>
    <text x="45" y="200" text-anchor="middle" font-family="Bricolage Grotesque" font-size="14" font-weight="800" fill="#FFB020">10%</text>
    <text x="45" y="214" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#FFD873">+ cuota fija</text>
    <text x="45" y="286" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#5AC8FA">TRAMO II</text>
    <text x="45" y="298" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#9098A6">Exceso s/ T.I</text>
  </g>

  <!-- ESCALÓN 3: Tramo III (20%) -->
  <g transform="translate(245, 0)">
    <!-- Bases previas -->
    <rect x="0" y="175" width="90" height="95" fill="#1C2027" stroke="#262B33"/>
    <!-- Porción excedente 20% -->
    <rect x="0" y="120" width="90" height="55" rx="4" fill="#FFB020" fill-opacity="0.45" stroke="#FFB020" stroke-width="1.4"/>
    <text x="45" y="148" text-anchor="middle" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#FFD873">20%</text>
    <text x="45" y="162" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#EDEEF0">+ cuota fija</text>
    <text x="45" y="286" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#5AC8FA">TRAMO III</text>
    <text x="45" y="298" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#9098A6">Exceso s/ T.II</text>
  </g>

  <!-- ESCALÓN 4: Tramo IV (30%) -->
  <g transform="translate(350, 0)">
    <!-- Bases previas -->
    <rect x="0" y="120" width="95" height="150" fill="#1C2027" stroke="#262B33"/>
    <!-- Porción excedente 30% -->
    <rect x="0" y="65" width="95" height="55" rx="4" fill="#FF5C5C" fill-opacity="0.3" stroke="#FF5C5C" stroke-width="1.6"/>
    <text x="47.5" y="93" text-anchor="middle" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#FF5C5C">30%</text>
    <text x="47.5" y="108" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" font-weight="600" fill="#FF5C5C">+ $288.57</text>
    <text x="47.5" y="286" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#FF5C5C">TRAMO IV</text>
    <text x="47.5" y="298" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#9098A6">Exceso s/ $2,038</text>
  </g>

  <!-- ================= SILUETA HUMANA SUBIENDO (ESTILO OUTLINE) ================= -->
  <g transform="translate(195, 115)">
    <!-- Cabeza -->
    <circle cx="20" cy="10" r="5.5" fill="none" stroke="#EDEEF0" stroke-width="1.5"/>
    <!-- Torso -->
    <line x1="20" y1="16" x2="20" y2="34" stroke="#EDEEF0" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Brazo señalando hacia arriba -->
    <line x1="20" y1="20" x2="34" y2="12" stroke="#FFB020" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="10" y2="28" stroke="#EDEEF0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Piernas en movimiento de subida -->
    <line x1="20" y1="34" x2="32" y2="48" stroke="#EDEEF0" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="12" y2="52" stroke="#EDEEF0" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Flechas y llamadas que conectan los excesos -->
  <path d="M125 210 L135 210" stroke="#FFB020" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M230 155 L240 155" stroke="#FFB020" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M335 98 L345 98" stroke="#FF5C5C" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
